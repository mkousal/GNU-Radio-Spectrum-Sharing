id: spectrumSharing_CAF
label: CAF
category: '[spectrumSharing]'

templates:
  imports: |
    import numpy as np
    from gnuradio import spectrumSharing
  make: spectrumSharing.CAF(
          input_len=${input_len},
          tau_vec=${tau_vec},
          alpha_vec=${alpha_vec},
          peak_tau=${peak_tau},
          peak_alpha=${peak_alpha}
        )
  callbacks:
    - set_tau_vec(${tau_vec})
    - set_alpha_vec(${alpha_vec})
    - set_peak_tau(${peak_tau})
    - set_peak_alpha(${peak_alpha})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
  - id: input_len
    label: Input Window Length
    dtype: int
    default: 1024

  - id: tau_vec
    label: Tau Vector
    dtype: raw
    default: np.arange(-130, -124)

  - id: alpha_vec
    label: Alpha Vector
    dtype: raw
    default: np.linspace(0, 0.0002, 5)

  - id: peak_tau
    label: Peak Tau
    dtype: int
    default: -128

  - id: peak_alpha
    label: Peak Alpha
    dtype: float
    default: 0.0

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
  - label: in
    domain: stream
    dtype: complex
    vlen: ${input_len}

outputs:
  - label: metric
    domain: stream
    dtype: float

  - label: caf_mesh
    domain: stream
    dtype: float
    vlen: ${len(tau_vec) * len(alpha_vec)}

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
